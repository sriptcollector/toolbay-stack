<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Toolbay Stack">
  <title>Toolbay Stack</title>
  <!--
    Three stacked layers, the bottom two solid and the top one drawn as an
    outline: the stack is a thing you build on, and the top layer is the one
    you are still writing. The notch on the right of each layer is a seam —
    this project's whole argument is that the seams between engines are where
    the failures live.
  -->
  <defs>
    <linearGradient id="tbs-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fafafa"/>
      <stop offset="1" stop-color="#909090"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="20" fill="#101010"/>
  <g transform="translate(48 50)">
    <!-- bottom layer -->
    <path d="M-30 16 L0 30 L30 16 L0 2 Z" fill="url(#tbs-g)" opacity="0.45"/>
    <!-- middle layer -->
    <path d="M-30 2 L0 16 L30 2 L0 -12 Z" fill="url(#tbs-g)" opacity="0.75"/>
    <!-- top layer, outlined: the one still being written -->
    <path d="M-30 -12 L0 2 L30 -12 L0 -26 Z" fill="none" stroke="#fafafa" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>
